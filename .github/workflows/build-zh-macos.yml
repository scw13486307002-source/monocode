name: Build Chinese macOS app

on:
  workflow_dispatch:
  push:
    branches: [feat/zh-cn]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: cargo fmt --all
      - run: npm run build:mac:zh
      - uses: actions/upload-artifact@v4
        with:
          name: MonoCode-Chinese-macOS-Apple-Silicon
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
